<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentual Chamativo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a1e3d;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #0a1e3d;
            border-radius: 24px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .prioridade {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #d3e3f7;
            font-size: 14px;
            line-height: 1.4;
        }

        .prioridade::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffd700;
        }

        /* Percentual de forma chamativa, texto simples, SEM pill */
        .percentual {
            font-size: 40px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -1px;
        }

        .percentual span {
            color: #ffd700;
            font-weight: 400;
        }

        .subtexto {
            margin-top: 8px;
            color: #a9b8d1;
            font-size: 14px;
        }

        .cta {
            margin-top: 24px;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #ffc107 0%, #ffb300 100%);
            color: #000000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 193, 7, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .cta:active {
            transform: translateY(2px);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }

        .alternativo {
            margin-top: 16px;
            width: 100%;
            padding: 14px 24px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .alternativo:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Efeito de brilho no percentual para chamar atenção */
        .percentual {
            position: relative;
        }

        .percentual::after {
            content: '';
            position: absolute;
            top: -8px;
            right: -8px;
            bottom: -8px;
            left: -8px;
            background: radial-gradient(circle, rgba(255, 213, 79, 0.35) 0%, transparent 70%);
            border-radius: 16px;
            z-index: -1;
            filter: blur(12px);
            animation: pulsar 2.5s ease-in-out infinite;
        }

        @keyframes pulsar {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.08); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="prioridade">
            Prioridade na compra de ingressos, à frente de quem não é sócio
        </div>

        <div class="percentual">
            86<span>.</span>7<span>%</span>
        </div>
        <div class="subtexto">
            de compatibilidade · 5,6 pontos abaixo do recomendado
        </div>

        <button class="cta">Garantir meu desconto de 50%</button>
        <button class="alternativo">Alternativo</button>
    </div>
</body>
</html>
