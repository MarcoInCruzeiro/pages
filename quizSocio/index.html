    <style>
        /* 
 * Organized CSS Sections:
 *  1. CSS Variables
 *  2. Base Styles
 *  3. Layout
 *  4. Components
 *  5. Utilities
 *  6. Animations & Transitions
 *  7. Media Queries
 */


        :root {
            --azul-profundo: #021a3e;
            --azul-cruzeiro: #004080;
            --azul-vivo: #007bff;
            --azul-claro: #e0f2ff;
            --branco: #ffffff;
            --grafite: #2c3e50;
            --cinza: #7f8c8d;
            --linha: rgba(255, 255, 255, 0.1);
            --sombra: 0 10px 30px rgba(0, 0, 0, 0.1);
            --raio: 16px;
            --estrelas: radial-gradient(1px 1px at 10% 20%, rgba(255, 255, 255, 0.3), transparent),
                radial-gradient(1px 1px at 30% 65%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(1.5px 1.5px at 50% 15%, rgba(255, 255, 255, 0.25), transparent),
                radial-gradient(1px 1px at 70% 45%, rgba(255, 255, 255, 0.15), transparent),
                radial-gradient(1.5px 1.5px at 85% 75%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(1px 1px at 15% 85%, rgba(255, 255, 255, 0.15), transparent),
                radial-gradient(1px 1px at 60% 90%, rgba(255, 255, 255, 0.1), transparent),
                radial-gradient(1.5px 1.5px at 90% 10%, rgba(255, 255, 255, 0.2), transparent),
                radial-gradient(1px 1px at 40% 40%, rgba(255, 255, 255, 0.1), transparent);
        }

        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--grafite);
            font-family: "Outfit", sans-serif;
            background:
                radial-gradient(ellipse at 15% 50%, rgba(0, 64, 128, 0.3), transparent 50%),
                radial-gradient(ellipse at 80% 25%, rgba(0, 123, 255, 0.12), transparent 40%),
                radial-gradient(ellipse at 50% 85%, rgba(0, 30, 80, 0.5), transparent 50%),
                radial-gradient(ellipse at 50% 0%, rgba(0, 64, 128, 0.2), transparent 60%),
                var(--estrelas),
                linear-gradient(175deg, #000b22 0%, #021a3e 25%, #002a5e 50%, #001830 80%, #000d29 100%);
            background-size: auto, auto, auto, auto, 300px 300px, auto;
            background-attachment: fixed;
            min-height: 100vh;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .page {
            display: grid;
            grid-template-columns: 1fr;
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            padding: clamp(24px, 4vh, 48px) 0;
        }

        .page>section {
            grid-column: 1;
            grid-row: 1;
        }

        .hero {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            gap: 32px;
            align-items: center;
        }

        .hero-card,
        .quiz-card,
        .result-card,
        .plans-card {
            border: 1px solid rgba(255, 255, 255, 0.2);
            /* Borda mais suave */
            border-radius: var(--raio);
            box-shadow: var(--sombra);
            backdrop-filter: blur(12px);
            /* Blur mais suave */
            background-color: rgba(255, 255, 255, 0.05);
            /* Um toque de cor para cards principais */
        }

        .hero-card {
            grid-column: 1;
            grid-row: 1;
            position: relative;
            overflow: hidden;
            min-height: clamp(420px, 50vh, 560px);
            padding: clamp(24px, 5vw, 48px);
            color: var(--branco);
            background:
                linear-gradient(140deg, rgba(0, 30, 80, 0.95), rgba(0, 60, 140, 0.8)),
                repeating-linear-gradient(115deg, transparent 0 20px, rgba(255, 255, 255, 0.03) 20px 22px);
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }

        .hero-card::after {
            content: "";
            position: absolute;
            right: -60px;
            bottom: -60px;
            width: 420px;
            height: 420px;
            background: url('./img/cruzeiro.png') no-repeat center / contain;
            opacity: 0.08;
            pointer-events: none;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 clamp(16px, 2.5vh, 20px);
            padding: 8px 12px;
            color: var(--azul-claro);
            border: 1px solid var(--linha);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            font-size: clamp(0.85rem, 1.5vw, 0.9rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 500;
        }

        h1 {
            position: relative;
            z-index: 1;
            max-width: 780px;
            /* Largura um pouco maior */
            margin: 0;
            font-family: "Outfit", sans-serif;
            font-size: clamp(3.2rem, 7.5vw, 7rem);
            /* Fonte ligeiramente maior */
            line-height: 0.95;
            /* Line height ajustado */
            letter-spacing: 0;
            /* Remove letter spacing para h1 */
            text-transform: uppercase;
            font-weight: 700;
        }

        .hero-copy {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: clamp(20px, 3vh, 28px) 0 0;
            color: rgba(255, 255, 255, 0.75);
            font-size: clamp(1.05rem, 2.2vw, 1.25rem);
            line-height: 1.7;
        }

        .hero-stats {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: clamp(24px, 4vh, 40px);
        }

        .stat {
            padding: clamp(14px, 2.5vw, 18px);
            border: 1px solid var(--linha);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.07);
        }

        .stat strong {
            display: block;
            font-size: clamp(1.4rem, 2.5vw, 1.6rem);
            font-weight: 600;
            color: var(--azul-claro);
        }

        .stat span {
            color: rgba(255, 255, 255, 0.6);
            font-size: clamp(0.85rem, 1.5vw, 0.9rem);
        }

        .quiz-card {
            padding: clamp(24px, 4vw, 32px);
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 1;
        }

        .progress {
            height: 12px;
            /* Altura um pouco maior */
            overflow: hidden;
            border-radius: 999px;
            background: #eef5ff;
            /* Fundo do progresso */
        }

        .progress-bar {
            width: 20%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--azul-profundo), var(--azul-cruzeiro));
            /* Gradiente mais forte */
            transition: width 0.35s ease-out;
            /* Transição mais suave */
        }

        .step-info {
            display: flex;
            justify-content: space-between;
            gap: clamp(12px, 2vw, 16px);
            margin: clamp(16px, 2.5vh, 20px) 0;
            color: var(--cinza);
            font-size: clamp(0.9rem, 1.5vw, 0.95rem);
            font-weight: 500;
        }

        .question {
            margin: 0 0 clamp(20px, 3vh, 28px);
            font-size: clamp(1.6rem, 3.2vw, 2.4rem);
            line-height: 1.2;
            letter-spacing: -0.03em;
            color: var(--grafite);
            font-weight: 600;
        }

        .options {
            display: grid;
            gap: clamp(10px, 2vw, 14px);
        }

        .option {
            width: 100%;
            padding: clamp(14px, 2.5vw, 18px) clamp(16px, 3vw, 20px);
            text-align: left;
            color: var(--grafite);
            border: 1px solid #dbe6f5;
            border-radius: 16px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .option:hover {
            transform: translateY(-3px);
            /* Efeito de hover mais pronunciado */
            border-color: var(--azul-vivo);
            box-shadow: 0 10px 25px rgba(0, 51, 160, 0.1);
            /* Sombra mais suave */
        }

        .option.selected {
            transform: translateY(-2px);
            border-color: var(--azul-vivo) !important;
            box-shadow: 0 8px 20px rgba(0, 51, 160, 0.15) !important;
            background-color: var(--azul-claro) !important;
            /* Cor de fundo mais clara para selecionado */
        }

        .option strong {
            display: block;
            margin-bottom: 6px;
            /* Margem ajustada */
            font-size: 1.05rem;
        }

        .option span {
            color: var(--cinza);
            font-size: 0.95rem;
            /* Fonte ligeiramente maior */
        }

        .range-wrap {
            display: grid;
            gap: clamp(12px, 2vw, 16px);
            padding: clamp(16px, 3vw, 20px);
            border: 1px solid #dbe6f5;
            border-radius: 18px;
            background: #fff;
        }

        .range-value {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 14px;
            /* Aumenta o gap */
        }

        .range-value strong {
            color: var(--azul-cruzeiro);
            font-size: 2.4rem;
            /* Fonte ligeiramente maior */
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--azul-cruzeiro);
            height: 8px;
            /* Altura do slider */
            cursor: grab;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--azul-vivo);
            cursor: grab;
            margin-top: -8px;
            /* Centraliza o thumb */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--azul-vivo);
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            gap: clamp(12px, 2vw, 16px);
            margin-top: clamp(20px, 3vh, 28px);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            /* Altura ligeiramente maior */
            padding: 0 24px;
            /* Padding ajustado */
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            /* Efeito de hover mais pronunciado */
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            /* Opacidade ajustada */
            transform: none;
            box-shadow: none;
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(90deg, var(--azul-profundo), var(--azul-vivo));
            /* Gradiente mais forte */
            font-weight: 600;
        }

        .btn-secondary {
            color: var(--azul-cruzeiro);
            background: #eff7ff;
            /* Fundo mais suave */
            border: 1px solid var(--azul-claro);
        }

        .btn-secondary:hover {
            background: var(--azul-claro);
        }

        .results {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(20px, 3vw, 28px);
            margin-top: clamp(24px, 3vh, 32px);
        }

        .result-card,
        .plans-card {
            padding: clamp(24px, 4vw, 32px);
            color: var(--branco);
            background: linear-gradient(160deg, rgba(0, 20, 70, 0.95), rgba(0, 40, 100, 0.85));
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .result-badge {
            display: inline-flex;
            padding: clamp(6px, 1vw, 8px) clamp(10px, 2vw, 14px);
            color: var(--azul-cruzeiro);
            border-radius: 999px;
            background: var(--azul-claro);
            font-size: clamp(0.8rem, 1.3vw, 0.85rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .result-card>p:not(.price) {
            margin: clamp(12px, 2vh, 16px) 0;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(1.4rem, 1.5vw, 1rem);
        }

        .result-plan {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: clamp(16px, 3vw, 20px);
            margin: clamp(20px, 3vh, 28px) 0;
        }

        .result-plan h2 {
            color: var(--branco);
            margin: 0;
            font-size: clamp(1.5rem, 3.2vw, 2.1rem);
            /* Fonte ajustada */
            line-height: 1.25;
            letter-spacing: -0.03em;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .result-plan img {
            width: 100%;
            height: clamp(84px, 14.4vw, 120px);
            object-fit: contain;
            border-radius: 14px;
            padding: 4px;
        }

        .plan img {
            width: 100%;
            height: clamp(72px, 14.4vw, 96px);
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: clamp(8px, 1.5vw, 10px);
            padding: 4px;
        }

        .price {
            margin: 0;
            color: var(--azul-vivo);
            font-size: clamp(1.6rem, 3vw, 2rem);
            font-weight: 800;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        .reason-list,
        .plan ul {
            margin: clamp(16px, 2.5vh, 20px) 0 0;
            padding: 0;
            list-style: none;
        }

        .reason-list li,
        .plan li {
            display: flex;
            gap: clamp(8px, 1.5vw, 12px);
            margin-top: clamp(8px, 1.5vh, 12px);
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            font-size: clamp(1.3rem, 1.5vw, 0.95rem);
        }

        .reason-list li::before,
        .plan li::before {
            content: "";
            flex: 0 0 9px;
            /* Tamanho ajustado */
            width: 9px;
            height: 9px;
            margin-top: 7px;
            /* Centraliza verticalmente */
            border-radius: 50%;
            background: var(--azul-vivo);
            box-shadow: 0 0 5px var(--azul-vivo);
            /* Pequeno brilho */
        }

        .plans-title {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: clamp(12px, 2vw, 16px);
            margin-bottom: clamp(14px, 2.5vh, 18px);
        }

        .plans-title h2 {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 1.8rem);
            letter-spacing: -0.04em;
            color: var(--branco);
            font-weight: 600;
        }

        .plans-title span {
            color: var(--cinza);
            font-size: clamp(0.9rem, 1.5vw, 0.95rem);
        }

        .plans-list {
            display: grid;
            gap: clamp(10px, 2vw, 14px);
        }

        .plan {
            display: flex;
            flex-direction: column;
            padding: clamp(14px, 2.5vw, 18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fefeff;
            background: rgb(0 42 167 / 70%);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .plan:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .plan h3 {
            margin: 0 0 clamp(6px, 1vw, 8px);
            font-size: clamp(1rem, 1.8vw, 1.1rem);
            color: var(--branco);
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #FFD700, #FFEC8B, #FFD700);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: goldShine 3s ease-in-out infinite;
        }

        @keyframes goldShine {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .plan p,
        .plan small {
            color: rgba(255, 255, 255, 0.6);
            /* Cor mais suave */
            font-size: 1.1rem;
        }

        .plan-score {
            min-width: 90px;
            /* Largura ajustada */
            padding: 10px 12px;
            /* Padding ajustado */
            text-align: center;
            color: var(--azul-profundo);
            /* Cor mais profunda */
            border-radius: 16px;
            /* Raio ajustado */
            background: var(--azul-claro);
            font-weight: 800;
            font-size: 1rem;
            margin-top: auto;
            /* Empurra para baixo */
        }

        .plan-cta {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--azul-profundo), var(--azul-vivo));
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .plan-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            position: absolute !important;
        }

        .start-button {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            padding: 0 clamp(28px, 4vw, 36px);
            margin-top: clamp(24px, 4vh, 40px);
            border: 0;
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(90deg, var(--azul-vivo), var(--azul-cruzeiro));
            font-size: clamp(1.1rem, 2vw, 1.2rem);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .start-button:hover {
            transform: translateY(-3px);
            /* Efeito de hover mais pronunciado */
            box-shadow: 0 15px 30px rgba(0, 51, 160, 0.3);
            /* Sombra mais forte */
        }

        /* Transições Suaves e Animações Minimalistas */
        .hero-card,
        .result-card,
        .plans-card {
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Estado base para seções injetadas dinamicamente */
        .dynamic-section {
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Estados de animação para seções dinâmicas */
        .dynamic-section.is-entering {
            opacity: 1;
            transform: translateY(0);
        }

        .dynamic-section.is-exiting {
            opacity: 0;
            transform: translateY(-15px);
            pointer-events: none;
        }

        /* Hero card usa as mesmas classes para saída */
        .hero-card.is-exiting {
            opacity: 0;
            transform: translateY(-15px);
            pointer-events: none;
            z-index: 1;
        }

        /* Hero section para transições de seção completa */
        .hero {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero.is-exiting {
            opacity: 0;
            transform: translateY(-15px);
            pointer-events: none;
            z-index: 1;
        }

        /* Animação de entrada para os elementos internos do quiz */
        .question,
        .options,
        .step-info {
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Efeito de hover e clique para opções */
        .option {
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .option:active {
            transform: scale(0.97) translateY(-1px) !important;
        }

        .option.selected {
            background-color: var(--azul-claro) !important;
            border-color: var(--azul-vivo) !important;
            box-shadow: 0 8px 20px rgba(0, 51, 160, 0.15) !important;
            transform: translateY(-2px);
        }


        @media (min-width: 1200px) {
            .hero-card {
                min-height: clamp(480px, 65vh, 520px);
            }
        }

        @media (max-width: 900px) {
            .hero {

        function getPriorityValue(plan, gamesPerYear) {
            const priority = plan.prioridadeNaCompra?.prioridade;

            if (Array.isArray(priority)) {
                const level = getFrequentLevel(plan, gamesPerYear);
                const found = priority.find((item) => item.nivel === level);
                return found ? found.prioridade : 4;
            }

            return priority || 4;
        }

        function getFrequentLevel(plan, gamesPerYear) {
            if (!plan.jogosFrequentes) {
                return null;
            }

            const level = plan.jogosFrequentes.niveis.find((item) => {
                const max = item.jogosMaximos === null ? Infinity : item.jogosMaximos;
                return gamesPerYear >= item.jogosMinimos && gamesPerYear <= max;
            });

            return level ? Number(level.nome.replace(/\D/g, "")) : 1;
        }

            if (plan.ingressoGratis) {

            if (!plan.descontoEmIngresso?.ativo) {

            if (plan.slug === "time-do-povo") {

        /**

         * @property {number} interesseExperiencias

         */

        const ATTRIBUTE_LABELS = {
            importanciaPreco: "Sensibilidade ao preço",
            frequenciaEstadio: "Frequência no estádio",
            interesseDescontos: "Interesse em descontos",
            interesseExperiencias: "Interesse em experiências",
            levaAcompanhantes: "Levar acompanhantes",

            consumoProdutosOficiais: "Consumo de produtos oficiais"

        /**
         * Constrói o perfil comportamental do usuário com base nas respostas do quiz.
         * @param {Object} answers Respostas do quiz
         * @returns {UserProfile} Perfil do usuário mapeado
         */
        function buildUserProfile(answers) {
            const profile = {
                importanciaPreco: 0,
                frequenciaEstadio: 0,
                interesseDescontos: 0,
                interesseExperiencias: 0,
                levaAcompanhantes: 0,
                prioridadeIngressos: 0,
                consumoProdutosOficiais: 0
            };

            questions.forEach(q => {
                const val = answers[q.key];
                if (q.type === "range") {
                    if (q.getEffects) {
                        const effects = q.getEffects(val);
                        for (const attr in effects) {
                            profile[attr] += effects[attr];
                        }
                    }
                } else {
                    const selectedOption = q.options.find(opt => opt.value === val);
                    if (selectedOption && selectedOption.effects) {
                        for (const attr in selectedOption.effects) {
                            profile[attr] += selectedOption.effects[attr];
                        }
                    }
                }
            });

            // Normaliza cada atributo para a escala de 0 a 10
            for (const attr in profile) {
                profile[attr] = Math.min(10, Math.max(0, profile[attr]));
            }

            return profile;
        }

        /**
         * Gera dinamicamente o perfil comportamental/vetorial de cada plano usando características reais do objeto de dados.
         * @param {Object} plan Plano do Cruzeiro
         * @returns {UserProfile} Perfil vetorial gerado para o plano
         */
        function generatePlanProfile(plan) {
            const allPlans = Object.values(assinaturasSocios);
            const prices = allPlans.map(p => p.precoMensal);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);

            // 1. Sensibilidade ao preço: planos mais caros são MENOS sensíveis ao preço (0 a 10)
            // CORREÇÃO: Invertido - planos mais caros têm MAIOR importanciaPreco (menos sensíveis ao preço)
            const importanciaPreco = maxPrice === minPrice
                ? 5
                : Math.round(((plan.precoMensal - minPrice) / (maxPrice - minPrice)) * 10);

            // 2. Frequência no estádio: planos com ingressos grátis ou descontos recorrentes pontuam mais alto
            let frequenciaEstadio = 0;
            if (plan.ingressoGratis) {
                frequenciaEstadio = 10;
            } else if (plan.slug === 'cabuloso-cativo') {
                frequenciaEstadio = 10;
            } else if (plan.descontoEmIngresso && plan.descontoEmIngresso.ativo) {
                if (plan.slug === 'cabuloso-max') {
                    frequenciaEstadio = 8;
                } else if (plan.slug === 'cabuloso') {
                    frequenciaEstadio = 7;
                } else if (plan.slug === 'time-do-povo') {
                    frequenciaEstadio = 5;
                } else {
                    frequenciaEstadio = 4;
                }
            } else {
                frequenciaEstadio = 2; // Plano de entrada (Meu Cruzeiro)
            }

            // 3. Interesse em descontos: baseado nos percentuais de descontos de loja e ingressos
            let interesseDescontos = 0;
            const discountPercent = plan.descontoNaLoja?.percentual || 0;
            interesseDescontos += discountPercent * 20; // e.g. 0.15 * 20 = 3
            if (plan.descontoEmIngresso?.ativo) {
                if (plan.descontoEmIngresso.descontoPercentual) {
                    interesseDescontos += plan.descontoEmIngresso.descontoPercentual * 10; // e.g. 0.65 * 10 = 6.5
                } else if (plan.jogosFrequentes) {
                    interesseDescontos += 6;
                } else {
                    interesseDescontos += 4;
                }
            }
            interesseDescontos = Math.min(10, Math.round(interesseDescontos));

            // 4. Interesse em experiências: baseado em conteúdos exclusivos, quizzes e etc
            let interesseExperiencias = 0;
            if (plan.conteudoExclusivo) interesseExperiencias += 3;
            if (plan.participaçãoEmQuizzes) interesseExperiencias += 3;
            if (plan.votacaoEmDecisoesNoClube) interesseExperiencias += 4;
            interesseExperiencias = Math.min(10, interesseExperiencias);

            // 5. Levar acompanhantes: quantidade de ingressos adicionais com desconto
            let levaAcompanhantes = 0;
            if (plan.descontoEmIngresso?.quantidadeIngressos) {
                levaAcompanhantes = plan.descontoEmIngresso.quantidadeIngressos * 4; // 2 * 4 = 8
            } else {
                levaAcompanhantes = 1;
            }
            levaAcompanhantes = Math.min(10, levaAcompanhantes);

            // 6. Prioridade em ingressos: mapeado da escala de prioridade do clube (menor número = maior prioridade)
            let prioridadeIngressos = 0;
            const priority = plan.prioridadeNaCompra?.prioridade;
            if (plan.slug === 'cabuloso-cativo') {
                prioridadeIngressos = 10;
            } else if (priority === 1) {
                prioridadeIngressos = 9;
            } else if (Array.isArray(priority)) {
                prioridadeIngressos = 7;
            } else if (priority === 3) {
                prioridadeIngressos = 5;
            } else if (priority === 4) {
                prioridadeIngressos = 3;
            } else {
                prioridadeIngressos = 2;
            }

            // 7. Consumo de produtos oficiais: com base no desconto disponível na loja oficial do clube
            const consumoProdutosOficiais = plan.descontoNaLoja?.percentual
                ? Math.round(plan.descontoNaLoja.percentual * 66) // 0.15 * 66 = 10, 0.10 * 66 = 7
                : 0;

            return {
                importanciaPreco,
                frequenciaEstadio,
                interesseDescontos,
                interesseExperiencias,
                levaAcompanhantes,
                prioridadeIngressos,
                consumoProdutosOficiais
            };
        }

        /**
         * Chaves de atributos que compõem o vetor geométrico de engajamento/benefícios.
         * Agora inclui 'importanciaPreco' já que foi corrigida a lógica.
         * @type {string[]}
         */
        const ENGAGEMENT_ATTRIBUTES = [
            'importanciaPreco',
            'frequenciaEstadio',
            'interesseDescontos',
            'interesseExperiencias',
            'levaAcompanhantes',
            'prioridadeIngressos',
            'consumoProdutosOficiais'
        ];

        /**
         * Calcula a Similaridade do Cosseno entre dois perfis usando apenas atributos de engajamento.
         * Função pura: não possui efeitos colaterais e não depende de estado externo.
         *
         * @param {UserProfile} userProfile Perfil do usuário
         * @param {UserProfile} planProfile Perfil do plano
         * @returns {number} Similaridade entre 0.0 e 1.0
         */
        function calculateCosineSimilarity(userProfile, planProfile) {
            let dotProduct = 0;
            let userMagnitudeSq = 0;
            let planMagnitudeSq = 0;

            ENGAGEMENT_ATTRIBUTES.forEach(attr => {
                const u = userProfile[attr] ?? 0;
                const p = planProfile[attr] ?? 0;

                dotProduct += u * p;
                userMagnitudeSq += u * u;
                planMagnitudeSq += p * p;
            });

            const userMagnitude = Math.sqrt(userMagnitudeSq);
            const planMagnitude = Math.sqrt(planMagnitudeSq);

            // Prevenção de divisão por zero: se algum vetor for nulo, similaridade é 0
            if (userMagnitude === 0 || planMagnitude === 0) {
                return 0.0;
            }

            return dotProduct / (userMagnitude * planMagnitude);
        }

        /**
         * Aplica a regra de negócio de penalidade de preço ao score de similaridade.
         * Se o usuário tem alta sensibilidade ao preço (importanciaPreco > 7)
         * e o plano custa mais que o limite (ex: R$ 100), reduz o score em 15%.
         *
         * @param {number} cosineScore Score bruto da similaridade do cosseno (0.0 a 1.0)
         * @param {UserProfile} userProfile Perfil do usuário (para acessar importanciaPreco)
         * @param {number} planPrice Preço mensal do plano
         * @returns {number} Score final ajustado (0.0 a 1.0)
         */
        function applyPricePenalty(cosineScore, userProfile, planPrice) {
            // CORREÇÃO: Ajustada a lógica de penalidade
            // Quando o usuário tem MAIOR importanciaPreco (menos sensível ao preço),
            // planos mais caros recebem MENOS penalidade
            const userSensitivity = (userProfile.importanciaPreco ?? 0) / 10;
            const maxPrice = Math.max(...plans.map(p => p.precoMensal));
            const priceRatio = planPrice / maxPrice;
            
            // Penalidade mais suave: apenas 25% do máximo
            // Quando userSensitivity é alto (pouco sensível ao preço), penalidade é menor
            const penalty = 1 - ((1 - userSensitivity) * priceRatio * 0.25);
            
            return cosineScore * Math.max(0.75, penalty); // Penalidade mínima de 0.75
        }

        /**
         * Orquestra o cálculo final de compatibilidade: cosseno + penalidade de preço + formatação.
         *
         * @param {UserProfile} userProfile Perfil do usuário
         * @param {UserProfile} planProfile Perfil do plano
         * @param {number} planPrice Preço mensal do plano
         * @returns {Object} Resultado com score final em porcentagem (0-100, 1 casa decimal) e influências
         */
        function calculateFinalMatch(userProfile, planProfile, planPrice) {
            // 1. Similaridade do Cosseno (vetor geométrico puro - sem preço)
            const cosineScore = calculateCosineSimilarity(userProfile, planProfile);

            // 2. Penalidade de preço (pós-processamento)
            const adjustedScore = applyPricePenalty(cosineScore, userProfile, planPrice);

            // 3. Formatação: 0.0-1.0 -> 0-100 com 1 casa decimal
            const compatibilityPercent = Math.round(adjustedScore * 1000) / 10;

            // 4. Cálculo de influências para explicabilidade (baseado em diferença absoluta nos atributos de engajamento)
            const influences = ENGAGEMENT_ATTRIBUTES.map(attr => {
                const userVal = userProfile[attr] ?? 0;
                const planVal = planProfile[attr] ?? 0;
                const diff = Math.abs(userVal - planVal);
                // Alinhamento: 10 = perfeito, 0 = oposto
                const alignment = 10 - diff;
                return {
                    key: attr,
                    diff,
                    alignment,
                    userValue: userVal,
                    planValue: planVal
                };
            });

            // Ordena: maior alinhamento (menor diff) primeiro; desempate pelo interesse do usuário
            influences.sort((a, b) => {
                if (a.diff !== b.diff) return a.diff - b.diff;
                return b.userValue - a.userValue;
            });

            return {
                compatibilityPercent,
                rawCosineScore: cosineScore,
                adjustedScore,
                influences
            };
        }

        /**
         * Compara o perfil do usuário com o perfil de um plano usando Similaridade do Cosseno + Penalidade de Preço.
         * Mantida para compatibilidade com código existente (renderResults, etc).
         *
         * @param {UserProfile} userProfile Perfil do usuário
         * @param {UserProfile} planProfile Perfil do plano
         * @param {Object} plan Objeto original do plano
         * @returns {Object} Resultado de compatibilidade
         */
        function calculateCompatibility(userProfile, planProfile, plan) {
            const result = calculateFinalMatch(userProfile, planProfile, plan.precoMensal);

            return {
                plan,
                compatibilityPercent: result.compatibilityPercent,
                distance: null, // Não aplicável com Cosseno
                influences: result.influences
            };
        }

        /**
         * Ordena e recomenda os 3 planos mais compatíveis com o usuário
         * @returns {Array} Top 3 recomendações
         */
        function recommendPlans() {
            const userProfile = buildUserProfile(state.answers);
            const userBudget = state.answers.budget;

            // Filtrar planos baseado no budget do usuário
            let eligiblePlans = plans;
            if (userBudget !== null && userBudget !== undefined) {
                eligiblePlans = plans.filter(plan => plan.precoMensal <= userBudget);
            }

            // Se nenhum plano couber no orçamento, mostra o mais barato como fallback
            if (eligiblePlans.length === 0) {
                eligiblePlans = [plans.reduce((a, b) => a.precoMensal < b.precoMensal ? a : b)];
            }

            return eligiblePlans.map(plan => {
                const planProfile = generatePlanProfile(plan);
                return calculateCompatibility(userProfile, planProfile, plan);
            })
                .sort((a, b) => b.compatibilityPercent - a.compatibilityPercent)
                .slice(0, 3);
        }

        function renderResults(resultsSection) {
            const recommendations = recommendPlans();
            const winner = recommendations[0];
            if (!resultsSection) return;

            const resultLogo = resultsSection.querySelector("#resultLogo");
            const resultPrice = resultsSection.querySelector("#resultPrice");
            const resultSummary = resultsSection.querySelector("#resultSummary");
            const resultReasons = resultsSection.querySelector("#resultReasons");
            const plansList = resultsSection.querySelector("#plansList");

            if (resultLogo && winner?.plan?.logo) {
                resultLogo.src = winner.plan.logo;
                resultLogo.alt = `Logo do plano ${winner.plan.nome}`;
            }
            if (resultPrice && winner?.plan?.precoMensal) {
                resultPrice.textContent = `${formatMoney(winner.plan.precoMensal)} / mês`;
            }
            if (resultSummary && winner?.compatibilityPercent !== undefined) {
                resultSummary.textContent = `Este plano tem ${winner.compatibilityPercent}% de compatibilidade com seu perfil e oferece os benefícios mais adequados.`;
            }

            if (resultReasons) {
                resultReasons.innerHTML = "";
                winner.influences.slice(0, 3).forEach((inf) => {
                    const item = document.createElement("li");
                    item.textContent = `Benefícios para: ${ATTRIBUTE_LABELS[inf.key] ?? inf.key}`;
                    resultReasons.appendChild(item);
                });
            }

            if (plansList) {
                plansList.innerHTML = "";
                recommendations.forEach((result, index) => {
                    const { plan, compatibilityPercent, influences } = result;
                    const ticketBenefit = getTicketBenefit(plan, state.answers.gamesPerYear);
                    const priority = getPriorityValue(plan, state.answers.gamesPerYear);
                    const card = document.createElement("article");
                    card.className = "plan";
                    const adhesion = plan.taxaDeAdesaoUnica ? `Taxa única: ${formatMoney(plan.taxaDeAdesaoUnica)}` : "Sem taxa de adesão única";
                    const topInfluence = influences?.[0];
                    const keyLabel = ATTRIBUTE_LABELS[topInfluence?.key] ?? topInfluence?.key ?? "características do plano";

                    card.innerHTML = `
                        <img src="${plan.logo}" alt="Logo do plano ${plan.nome}">
                        <div>
                            <h3>${index === 0 ? 'Recomendado' : 'Alternativa'}</h3>
                            <p>${formatMoney(plan.precoMensal)} / mês ou ${formatMoney(plan.precoAnual)} / ano</p>
                            <small>${adhesion}</small>
                            <ul>
                                <li>${ticketBenefit.text}</li>
                                <li>Prioridade ${priority}</li>
                                <li>${plan.descontoNaLoja?.texto || 'Até 10% na Loja do Cruzeiro'}</li>
                                <li>Destaque: Benefícios para ${keyLabel}</li>
                            </ul>
                        </div>
                        <div class="plan-score">${compatibilityPercent}%</div>
                        <a href="${plan.link}" target="_blank" class="plan-cta">Assinar agora</a>
                    `;
                    plansList.appendChild(card);
                });
            }
        }

        function renderQuestion() {
            const quizSection = document.querySelector('.quiz-card');
            if (!quizSection) return;

            const questionTitle = quizSection.querySelector("#quizTitle");
            const optionsContainer = quizSection.querySelector("#options");
            const stepCounterEl = quizSection.querySelector("#stepCounter");
            const progressBarEl = quizSection.querySelector("#progressBar");
            const backBtn = quizSection.querySelector("#backButton");
            const nextBtn = quizSection.querySelector("#nextButton");

            // Efeito suave de saída temporária
            questionTitle.style.opacity = "0";
            questionTitle.style.transform = "translateY(-4px)";
            optionsContainer.style.opacity = "0";
            optionsContainer.style.transform = "translateY(-4px)";

            setTimeout(() => {
                const question = questions[state.step];
                const progress = ((state.step + 1) / questions.length) * 100;

                questionTitle.textContent = question.title;
                stepCounterEl.textContent = `Pergunta ${state.step + 1} de ${questions.length}`;
                progressBarEl.style.width = `${progress}%`;
                backBtn.disabled = state.step === 0;

                // CORREÇÃO CRÍTICA: sempre inicia DESABILITADO
                nextBtn.disabled = true;
                nextBtn.textContent = state.step === questions.length - 1 ? "Ver resultado" : "Continuar";
                optionsContainer.innerHTML = "";

                if (question.type === "range") {
                    const wrap = document.createElement("div");
                    wrap.className = "range-wrap";
                    wrap.innerHTML = `
                        <div class="range-value">
                            <span>Frequência estimada</span>
                            <strong id="rangeOutput">${state.answers[question.key] ?? question.min}&nbsp;${question.suffix}</strong>
                        </div>
                        <input id="rangeInput" type="range" min="${question.min}" max="${question.max}" value="${state.answers[question.key] ?? question.min}">
                    `;
                    optionsContainer.appendChild(wrap);

                    const rangeInput = optionsContainer.querySelector("#rangeInput");
                    const rangeOutput = optionsContainer.querySelector("#rangeOutput");

                    rangeInput.addEventListener("input", (e) => {
                        const value = Number(e.target.value);
                        state.answers[question.key] = value;
                        rangeOutput.textContent = `${value} ${question.suffix}`;
                        nextBtn.disabled = false;
                    });

                    // Se já tem valor salvo (navegação voltar/avançar), habilita
                    if (state.answers[question.key] !== undefined && state.answers[question.key] !== question.min) {
                        nextBtn.disabled = false;
                    }
                } else {
                    question.options.forEach((item, idx) => {
                        const button = document.createElement("button");
                        button.type = "button";
                        button.className = "option";
                        button.dataset.optionIndex = idx;

                        // Se já tem resposta salva, marca e habilita
                        if (state.answers[question.key] === item.value) {
                            button.classList.add("selected");
                            nextBtn.disabled = false;
                        }

                        button.innerHTML = `<strong>${item.label}</strong><span>${item.description}</span>`;

                        button.style.opacity = "0";
                        button.style.transform = "translateY(10px)";
                        button.style.transitionDelay = `${idx * 0.04}s`;

                        optionsContainer.appendChild(button);

                        // Trigger stagger slide in
                        setTimeout(() => {
                            button.style.opacity = "1";
                            button.style.transform = "translateY(0)";
                        }, 20);
                    });
                }

                // Efeito suave de entrada
                questionTitle.style.opacity = "1";
                questionTitle.style.transform = "translateY(0)";
                optionsContainer.style.opacity = "1";
                optionsContainer.style.transform = "translateY(0)";
            }, 180);
        }


        function createQuizSection() {
            const section = document.createElement('section');
            section.className = 'quiz-card dynamic-section';
            section.setAttribute('aria-labelledby', 'quizTitle');
            section.innerHTML = `
                <div class="progress" aria-hidden="true">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="step-info">
                    <span id="stepCounter">Pergunta 1 de 10</span>
                    <span>Recomendação por custo-beneficio</span>
                </div>
                <h2 class="question" id="quizTitle"></h2>
                <div class="options" id="options"></div>
                <div class="actions">
                    <button class="btn btn-secondary" id="backButton" type="button">Voltar</button>
                    <button class="btn btn-primary" id="nextButton" type="button" disabled>Continuar</button>
                </div>
            `;
            return section;
        }

        function createResultsSection() {
            const section = document.createElement('section');
            section.className = 'results dynamic-section';
            section.id = 'results';
            section.setAttribute('aria-live', 'polite');
            section.innerHTML = `
                <article class="result-card">
                    <span class="result-badge">Plano recomendado</span>
                    <div class="result-plan">
                        <div>
                            <h2>Plano recomendado para você</h2>
                            <p class="price" id="resultPrice"></p>
                        </div>
                        <img id="resultLogo" alt="">
                    </div>
                    <p id="resultSummary"></p>
                    <ul class="reason-list" id="resultReasons"></ul>
                    <div class="actions">
                        <button class="btn btn-secondary" id="restartButton" type="button">Refazer quiz</button>
                        <button class="btn btn-primary" id="subscribeButton" type="button">Assinar agora</button>
                    </div>
                </article>
                <aside class="plans-card">
                    <div class="plans-title">
                        <h2>Melhores opções</h2>
                        <span>Recomendações personalizadas</span>
                    </div>
                    <div class="plans-list" id="plansList"></div>
                </aside>
            `;
            return section;
        }

        function transitionSection(fromElement, createToElementFn, onEnterCallback) {
            const toElement = createToElementFn();
            toElement.style.display = 'none';

            fromElement.parentNode.insertBefore(toElement, fromElement.nextSibling);

            requestAnimationFrame(() => {
                toElement.style.display = '';
                toElement.offsetHeight;

                toElement.classList.add('is-entering');
                fromElement.classList.add('is-exiting');

                const TRANSITION_DURATION = 500;
                setTimeout(() => {
                    fromElement.remove();
                    if (onEnterCallback) onEnterCallback(toElement);
                }, TRANSITION_DURATION);
            });
        }

        function bindSectionEvents(section, type) {
            if (type === 'quiz') {
                const backBtn = section.querySelector('#backButton');
                const nextBtn = section.querySelector('#nextButton');
                const optionsContainer = section.querySelector('#options');

                backBtn.addEventListener('click', onBackClick);
                nextBtn.addEventListener('click', () => onNextClick(nextBtn));
                optionsContainer.addEventListener('click', (e) => {
                    const option = e.target.closest('.option');
                    if (option) onOptionClick(option, nextBtn);
                });
            } else if (type === 'results') {
                section.querySelector('#restartButton').addEventListener('click', onRestartClick);
                section.querySelector('#subscribeButton').addEventListener('click', onSubscribeClick);
            }
        }

        function onBackClick() {
            if (state.step === 0) return;
            state.step -= 1;
            renderQuestion();
        }

        function onNextClick(nextBtn) {
            if (state.step === questions.length - 1) {
                const quizSection = document.querySelector('.quiz-card');
                transitionSection(quizSection, createResultsSection, (resultsSection) => {
                    bindSectionEvents(resultsSection, 'results');
                    renderResults(resultsSection);
                    resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                return;
            }
            state.step += 1;
            renderQuestion();
        }

        function onOptionClick(optionEl, nextBtn) {
            const optionsContainer = optionEl.closest('.options');
            optionsContainer.querySelectorAll('.option.selected').forEach(opt => opt.classList.remove('selected'));
            optionEl.classList.add('selected');
            const question = questions[state.step];
            const selectedOption = question.options[Number(optionEl.dataset.optionIndex)];
            state.answers[question.key] = selectedOption.value;
            nextBtn.disabled = false;
        }

        function createHeroSection() {
            const section = document.createElement('section');
            section.className = 'hero';
            section.innerHTML = `
                <div class="hero-card" id="heroCard">
                    <p class="eyebrow">Quiz Sócio 5 Estrelas</p>
                    <h1>Encontre o plano perfeito para viver o Cruzeiro mais de perto.</h1>
                    <button class="start-button" id="startButton" type="button">Iniciar Quiz</button>
                </div>
            `;
            return section;
        }

        function onRestartClick() {
            resetState();
            const resultsSection = document.querySelector('.results');
            transitionSection(resultsSection, createHeroSection, (newHeroSection) => {
                heroSection = newHeroSection;
                const newStartButton = heroSection.querySelector('#startButton');
                newStartButton.addEventListener('click', () => {
                    transitionSection(heroSection, createQuizSection, (quizSection) => {
                        bindSectionEvents(quizSection, 'quiz');
                        renderQuestion();
                    });
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function onSubscribeClick() {
            const recommendations = recommendPlans();
            const winner = recommendations[0];
            const url = winner.plan.link || 'https://socio5estrelas.com.br';
            window.open(url, '_blank');
        }

        function resetState() {
            state.step = 0;
            state.answers = {
                gamesPerYear: 0,
                wantsGuaranteedTicket: null,
                buysTwoTickets: null,
                needsPriority: null,
                wantsParticipation: null,
                wantsStoreDiscount: null,
                gameFrequency: null,
                familyPlan: null,
                digitalExperience: null,
                budget: null
            };
        }




        startButton.addEventListener("click", () => {
            transitionSection(heroSection, createQuizSection, (quizSection) => {
                bindSectionEvents(quizSection, 'quiz');
                renderQuestion();
            });
        });

    </script>
