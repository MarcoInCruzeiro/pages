<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
        .highlight { background: yellow; }
    </style>
</head>
<body>
    <h1>Análise Detalhada da Lógica de Recomendação</h1>
    <div id="output"></div>
    
    <script>
        // Analisando a lógica exata do código
        const prices = [12, 40, 100, 200, 400]; // Preços de todos os planos
        const minPrice = 12;
        const maxPrice = 400;
        
        function calculateImportanciaPreco(planPrice) {
            return maxPrice === minPrice
                ? 5
                : Math.round((1 - (planPrice - minPrice) / (maxPrice - minPrice)) * 10);
        }
        
        // Calculando importanciaPreco para cada plano
        const importanciaPrecoMeuCruzeiro = calculateImportanciaPreco(12);
        const importanciaPrecoTimeDoPovo = calculateImportanciaPreco(40);
        const importanciaPrecoCabuloso = calculateImportanciaPreco(100);
        const importanciaPrecoCabulosoMax = calculateImportanciaPreco(200);
        const importanciaPrecoCabulosoCativo = calculateImportanciaPreco(400);
        
        // Analisando o problema: A IMPORTÂNCIA DO PREÇO ESTÁ INVERTIDA!
        const output = document.getElementById('output');
        output.innerHTML = `
            <h2>ANÁLISE DO PROBLEMA</h2>
            <p><strong>PROBLEMA ENCONTRADO:</strong> A lógica de <code>importanciaPreco</code> está invertida!</p>
            
            <h3>Preços dos planos:</h3>
            <ul>
                <li>Meu Cruzeiro: R$ 12/mês</li>
                <li>Time do Povo: R$ 40/mês</li>
                <li>Cabuloso: R$ 100/mês</li>
                <li>Cabuloso Max: R$ 200/mês</li>
                <li>Cabuloso Cativo: R$ 400/mês</li>
            </ul>
            
            <h3>importanciaPreco atual (INVERTIDA):</h3>
            <ul>
                <li>Meu Cruzeiro (R$ 12): ${importanciaPrecoMeuCruzeiro}/10</li>
                <li>Time do Povo (R$ 40): ${importanciaPrecoTimeDoPovo}/10</li>
                <li>Cabuloso (R$ 100): ${importanciaPrecoCabuloso}/10</li>
                <li>Cabuloso Max (R$ 200): ${importanciaPrecoCabulosoMax}/10</li>
                <li>Cabuloso Cativo (R$ 400): ${importanciaPrecoCabulosoCativo}/10</li>
            </ul>
            
            <h3>EXPLICAÇÃO:</h3>
            <p>A fórmula atual: <code>Math.round((1 - (planPrice - minPrice) / (maxPrice - minPrice)) * 10)</code></p>
            <p>Para R$ 12: <code>1 - (12-12)/(400-12) = 1 - 0 = 1 * 10 = 10</code></p>
            <p>Para R$ 400: <code>1 - (400-12)/(400-12) = 1 - 1 = 0 * 10 = 0</code></p>
            
            <p class="highlight"><strong>O PROBLEMA:</strong> Isso significa que planos mais baratos têm MAIOR <code>importanciaPreco</code> (mais sensíveis ao preço), quando deveria ser o contrário!</p>
            
            <h3>CORREÇÃO NECESSÁRIA:</h3>
            <p>Deve ser invertido: Planos mais caros (que oferecem mais benefícios) deveriam ter <code>importanciaPreco</code> MAIOR (menos sensíveis ao preço).</p>
            
            <h3>Solução proposta:</h3>
            <pre>const importanciaPreco = Math.round(((planPrice - minPrice) / (maxPrice - minPrice)) * 10);</pre>
            
            <h3>Resultado corrigido:</h3>
            <ul>
                <li>Meu Cruzeiro (R$ 12): 0/10 (mais sensível ao preço)</li>
                <li>Time do Povo (R$ 40): 1/10</li>
                <li>Cabuloso (R$ 100): 3/10</li>
                <li>Cabuloso Max (R$ 200): 5/10</li>
                <li>Cabuloso Cativo (R$ 400): 10/10 (menos sensível ao preço)</li>
            </ul>
        `;
        
        // Agora vou simular o efeito da penalidade de preço
        function simulatePricePenalty(planPrice, userImportanciaPreco) {
            const sensitivity = userImportanciaPreco / 10;
            const maxPrice = 400;
            const priceRatio = planPrice / maxPrice;
            const penalty = 1 - (sensitivity * priceRatio * 0.45);
            return Math.max(0.55, penalty);
        }
        
        // Usuário com importanciaPreco = 5 (médio)
        const userSensitivity = 0.5;
        const penaltyTimeDoPovo = simulatePricePenalty(40, 5);
        const penaltyCabuloso = simulatePricePenalty(100, 5);
        
        output.innerHTML += `
            <h3>EFEITO DA PENALIDADE (usuário com importanciaPreco = 5):</h3>
            <ul>
                <li>Time do Povo (R$ 40): penalidade = ${penaltyTimeDoPovo.toFixed(4)}</li>
                <li>Cabuloso (R$ 100): penalidade = ${penaltyCabuloso.toFixed(4)}</li>
                <li>Diferença: ${((1/penaltyTimeDoPovo - 1/penaltyCabuloso)*100).toFixed(2)}% a favor do Time do Povo</li>
            </ul>
        `;
    </script>
</body>
</html>
