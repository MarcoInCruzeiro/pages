<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Teste de Lógica de Recomendação</h1>
    <div id="output"></div>
    
    <script>
        // Copiando dados do plano
        const assinaturasSocios = {
            meuCruzeiro: {
                nome: "Meu Cruzeiro",
                slug: "meu-cruzeiro",
                precoMensal: 12,
                ingressoGratis: true,
                descontoEmIngresso: { ativo: false },
                prioridadeNaCompra: { prioridade: 4 },
                descontoNaLoja: { percentual: 0.1 },
                conteudoExclusivo: true,
                participaçãoEmQuizzes: true,
                votacaoEmDecisoesNoClube: true
            },
            timeDoPovo: {
                nome: "Time do Povo",
                slug: "time-do-povo",
                precoMensal: 40,
                ingressoGratis: false,
                descontoEmIngresso: { 
                    ativo: true,
                    detalhes: "Todo jogo do Cruzeiro dentro dos setores Amarelo e Laranja custa R$ 40,00",
                    faixa: "setores Amarelo e Laranja"
                },
                prioridadeNaCompra: { prioridade: 3 },
                descontoNaLoja: { percentual: 0.15 },
                conteudoExclusivo: false,
                participaçãoEmQuizzes: true,
                votacaoEmDecisoesNoClube: false
            },
            cabuloso: {
                nome: "Cabuloso",
                slug: "cabuloso",
                precoMensal: 100,
                ingressoGratis: false,
                descontoEmIngresso: { ativo: true },
                jogosFrequentes: {
                    janelaMeses: 15,
                    niveis: [
                        { nome: "Cabuloso 1", jogosMinimos: 0, jogosMaximos: 9, descontoIngresso: 0.5 },
                        { nome: "Cabuloso 2", jogosMinimos: 10, jogosMaximos: 19, descontoIngresso: 0.55 },
                        { nome: "Cabuloso 3", jogosMinimos: 20, jogosMaximos: null, descontoIngresso: 0.6 }
                    ]
                },
                prioridadeNaCompra: { 
                    prioridade: [
                        { nivel: 1, prioridade: 3 },
                        { nivel: 2, prioridade: 2 },
                        { nivel: 3, prioridade: 1 }
                    ]
                },
                descontoNaLoja: { percentual: 0.15 },
                conteudoExclusivo: true,
                participaçãoEmQuizzes: true,
                votacaoEmDecisoesNoClube: true
            }
        };

        // Simulando respostas que deveriam direcionar para Cabuloso
        const answers = {
            gamesPerYear: 20, // Jogos frequentes - favorece Cabuloso
            wantsGuaranteedTicket: true, // Quer prioridade
            buysTwoTickets: true, // Leva acompanhantes
            needsPriority: true, // Precisa de prioridade
            wantsParticipation: true, // Quer conteúdo
            wantsStoreDiscount: true, // Quer descontos
            gameFrequency: "always", // Vai sempre ao estádio
            familyPlan: false, // Vai sozinho
            digitalExperience: true, // Quer experiência digital
            budget: 200 // Orçamento suficiente para Cabuloso
        };

        // Função de gerar perfil do plano
        function generatePlanProfile(plan) {
            const allPlans = [assinaturasSocios.meuCruzeiro, assinaturasSocios.timeDoPovo, assinaturasSocios.cabuloso];
            const prices = allPlans.map(p => p.precoMensal);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);

            const importanciaPreco = maxPrice === minPrice
                ? 5
                : Math.round((1 - (plan.precoMensal - minPrice) / (maxPrice - minPrice)) * 10);

            let frequenciaEstadio = 0;
            if (plan.ingressoGratis) {
                frequenciaEstadio = 10;
            } else if (plan.slug === 'cabuloso') {
                frequenciaEstadio = 7;
            } else if (plan.slug === 'time-do-povo') {
                frequenciaEstadio = 5;
            } else {
                frequenciaEstadio = 2;
            }

            let interesseDescontos = 0;
            const discountPercent = plan.descontoNaLoja?.percentual || 0;
            interesseDescontos += discountPercent * 20;
            if (plan.descontoEmIngresso?.ativo) {
                if (plan.slug === 'cabuloso') {
                    interesseDescontos += 6;
                } else {
                    interesseDescontos += 4;
                }
            }
            interesseDescontos = Math.min(10, Math.round(interesseDescontos));

            let interesseExperiencias = 0;
            if (plan.conteudoExclusivo) interesseExperiencias += 3;
            if (plan.participaçãoEmQuizzes) interesseExperiencias += 3;
            if (plan.votacaoEmDecisoesNoClube) interesseExperiencias += 4;
            interesseExperiencias = Math.min(10, interesseExperiencias);

            let levaAcompanhantes = 0;
            if (plan.slug === 'cabuloso') {
                levaAcompanhantes = 4;
            } else {
                levaAcompanhantes = 1;
            }
            levaAcompanhantes = Math.min(10, levaAcompanhantes);

            let prioridadeIngressos = 0;
            if (plan.slug === 'cabuloso') {
                prioridadeIngressos = 7;
            } else if (plan.slug === 'time-do-povo') {
                prioridadeIngressos = 5;
            } else {
                prioridadeIngressos = 3;
            }

            const consumoProdutosOficiais = plan.descontoNaLoja?.percentual
                ? Math.round(plan.descontoNaLoja.percentual * 66)
                : 0;

            return {
                importanciaPreco,
                frequenciaEstadio,
                interesseDescontos,
                interesseExperiencias,
                levaAcompanhantes,
                prioridadeIngressos,
                consumoProdutosOficiais
            };
        }

        // Simulando perfil de usuário para Cabuloso
        const userProfileForCabuloso = {
            importanciaPreco: 5, // Médio (Cabuloso é R$ 100, não é o mais barato)
            frequenciaEstadio: 10, // Alta frequência
            interesseDescontos: 8, // Alto interesse em descontos
            interesseExperiencias: 10, // Alto interesse em experiências
            levaAcompanhantes: 8, // Leva acompanhantes às vezes
            prioridadeIngressos: 10, // Prioridade máxima
            consumoProdutosOficiais: 9 // Alto consumo
        };

        // Calculando perfis
        const meuCruzeiroProfile = generatePlanProfile(assinaturasSocios.meuCruzeiro);
        const timeDoPovoProfile = generatePlanProfile(assinaturasSocios.timeDoPovo);
        const cabulosoProfile = generatePlanProfile(assinaturasSocios.cabuloso);

        // Função de similaridade do cosseno
        function calculateCosineSimilarity(userProfile, planProfile) {
            const ENGAGEMENT_ATTRIBUTES = [
                'importanciaPreco',
                'frequenciaEstadio',
                'interesseDescontos',
                'interesseExperiencias',
                'levaAcompanhantes',
                'prioridadeIngressos',
                'consumoProdutosOficiais'
            ];

            let dotProduct = 0;
            let userMagnitudeSq = 0;
            let planMagnitudeSq = 0;

            ENGAGEMENT_ATTRIBUTES.forEach(attr => {
                const u = userProfile[attr] ?? 0;
                const p = planProfile[attr] ?? 0;

                dotProduct += u * p;
                userMagnitudeSq += u * u;
                planMagnitudeSq += p * p;
            });

            const userMagnitude = Math.sqrt(userMagnitudeSq);
            const planMagnitude = Math.sqrt(planMagnitudeSq);

            if (userMagnitude === 0 || planMagnitude === 0) {
                return 0.0;
            }

            return dotProduct / (userMagnitude * planMagnitude);
        }

        // Calculando similaridades
        const simMeuCruzeiro = calculateCosineSimilarity(userProfileForCabuloso, meuCruzeiroProfile);
        const simTimeDoPovo = calculateCosineSimilarity(userProfileForCabuloso, timeDoPovoProfile);
        const simCabuloso = calculateCosineSimilarity(userProfileForCabuloso, cabulosoProfile);

        // Saída
        const output = document.getElementById('output');
        output.innerHTML = `
            <h2>Perfis dos Planos:</h2>
            <pre>Meu Cruzeiro: ${JSON.stringify(meuCruzeiroProfile, null, 2)}</pre>
            <pre>Time do Povo: ${JSON.stringify(timeDoPovoProfile, null, 2)}</pre>
            <pre>Cabuloso: ${JSON.stringify(cabulosoProfile, null, 2)}</pre>
            
            <h2>Perfil do Usuário (Cabuloso):</h2>
            <pre>${JSON.stringify(userProfileForCabuloso, null, 2)}</pre>
            
            <h2>Similaridades:</h2>
            <p>Meu Cruzeiro: ${(simMeuCruzeiro * 100).toFixed(1)}%</p>
            <p>Time do Povo: ${(simTimeDoPovo * 100).toFixed(1)}%</p>
            <p>Cabuloso: ${(simCabuloso * 100).toFixed(1)}%</p>
            
            <h2>Vencedor:</h2>
            <p>${simCabuloso > simTimeDoPovo && simCabuloso > simMeuCruzeiro ? 'CABULOSO (CORRETO)' : 'PROBLEMA DETECTADO!'}</p>
        `;

        // Log adicional
        console.log("Perfil Meu Cruzeiro:", meuCruzeiroProfile);
        console.log("Perfil Time do Povo:", timeDoPovoProfile);
        console.log("Perfil Cabuloso:", cabulosoProfile);
        console.log("Similaridades:", {
            meuCruzeiro: simMeuCruzeiro,
            timeDoPovo: simTimeDoPovo,
            cabuloso: simCabuloso
        });
    </script>
</body>
</html>
